name: Update Space Shooter Game
on:
  schedule:
    - cron: '0 0 * * *' # Chạy vào nửa đêm mỗi ngày
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công
permissions:
  contents: write
jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
